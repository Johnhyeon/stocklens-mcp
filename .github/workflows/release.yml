name: Release

# 태그 푸시(v*) 시 자동:
# 1. Python 빌드 (wheel + sdist)
# 2. GitHub Release 생성 + dist 자산 첨부
# 3. PyPI 업로드는 유료 배포 전환으로 중단

on:
  push:
    tags:
      - 'v*'  # v0.2.1, v0.3.0 등

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GitHub Release 생성용
      id-token: write  # PyPI Trusted Publishing (OIDC) 용
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify version matches tag
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Tag version ($TAG_VER) does not match pyproject.toml version ($PKG_VER)"
            exit 1
          fi
          echo "Version OK: $PKG_VER"

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify distribution
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Skip PyPI publish
        run: |
          echo "PyPI publishing is disabled after the paid distribution transition."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          body: |
            > 📬 **이메일 신청 없이 여기서만 받으시면 업데이트·출시 알림을 못 받아요.**
            > 앞으로 새 버전·신기능 소식 받으려면 [**1분 만에 구독하기**](https://bit.ly/3QwtF6I) (구글 폼)

            ---

            ## 📥 설치 / 업그레이드

            신규 설치와 업데이트는 구매자 안내문 기준으로 진행합니다.

            ## 📚 링크
            - [전체 도구 목록](https://github.com/Johnhyeon/stocklens-mcp/blob/main/guides/ko/TOOLS.md)
            - [프롬프트 예시](https://github.com/Johnhyeon/stocklens-mcp/blob/main/guides/ko/USAGE.md)
            - [품질 검증 내역](https://github.com/Johnhyeon/stocklens-mcp/blob/main/QUALITY.md)
