[project]
name = "stocklens-mcp"
version = "0.9.0"
description = "StockLens — AI가 진짜 데이터로 분석합니다. 한국·미국 주식 + ETF MCP 서버 (차트, 수급, 재무, 실적, 배당, 스크리닝, Excel)"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "Johnhyeon" }
]
keywords = ["mcp", "claude", "stock", "stocklens", "korea", "finance", "investment", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Natural Language :: Korean",
]
requires-python = ">=3.11"
dependencies = [
    # 상한을 반드시 둔다. mcp 2.0.0에서 mcp.server.fastmcp가 사라져서, 상한 없이
    # 나간 이 패키지를 새로 설치한 사람은 서버가 import 단계에서 죽었다
    # (ModuleNotFoundError: No module named 'mcp.server.fastmcp' → Claude/Codex 둘 다
    # "server disconnected"). DartLens·TelegramLens는 처음부터 <2.0.0이라 무사했고
    # 여기만 빠져 있었다. 2.x로 올리려면 FastMCP 사용부를 전부 옮겨야 하므로 별건이다.
    "mcp[cli]>=1.12.0,<2.0.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "openpyxl>=3.1.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.40",
    "cryptography>=42.0.0",
    "tomlkit>=0.12",
    # TLS 검증에 OS 인증서 저장소를 쓴다. 백신·회사망 프록시가 TLS를 가로채는 PC에서
    # certifi 번들만 믿으면 전부 CERTIFICATE_VERIFY_FAILED 로 죽는다(_http.py 참고).
    "truststore>=0.9",
    # 증권사 리포트 PDF 본문 추출(_pdf.py). pdftotext 계열은 한글이 통째로 날아가서
    # 쓰지 않는다 — 실측에서 pypdf 만 한글이 살아 나왔다.
    "pypdf>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Johnhyeon/stocklens-mcp"
Repository = "https://github.com/Johnhyeon/stocklens-mcp"
Issues = "https://github.com/Johnhyeon/stocklens-mcp/issues"

[project.scripts]
# 새 커맨드 (v0.2.0+)
stocklens = "stock_mcp_server.server:main"
stocklens-setup = "stock_mcp_server.setup_claude:main"
stocklens-doctor = "stock_mcp_server.doctor:main"
stocklens-activate = "stock_mcp_server.licensing:activate_cli"
# 하위 호환 (기존 naver-stock-mcp 사용자)
stock-mcp-server = "stock_mcp_server.server:main"
stock-mcp-setup = "stock_mcp_server.setup_claude:main"

[tool.pytest.ini_options]
# tests/ 밖에 떨어지는 개발용 스크립트(예: 루트의 수동 점검용 asyncio 스크립트)가
# 실수로 수집되지 않도록 범위를 못박는다.
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stock_mcp_server"]

[tool.hatch.build.targets.sdist]
# PyPI 사용자에게 불필요한 문서·GIF·아이콘 제외 (git 추적은 유지 → GitHub README 렌더링 정상)
exclude = [
    "assets/",
    "guides/",
    "QUALITY.md",
    ".github/",
    "tests/",
    "CLAUDE.md",
    "README.en.md",
    "install.ps1",
    "install.sh",
]
